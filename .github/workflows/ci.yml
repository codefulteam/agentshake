name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Package smoke (pack, clean install, end-to-end against the installed binary)
        run: npm run smoke
      - name: Two-UID isolation check in a disposable container (Linux only)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          npm pack --silent --pack-destination "$WORK" >/dev/null
          (cd "$WORK" && mkdir prefix && cd prefix && npm init -y >/dev/null && npm install --silent ../agentshake-*.tgz)
          docker pull ubuntu:24.04
          NODE_LINUX=$(dirname "$(dirname "$(command -v node)")") PKG_PREFIX="$WORK/prefix" bash test/isolation/run-container.sh
      - name: Inspect package contents
        run: npm pack --dry-run --json | node -e "const [p]=JSON.parse(require('fs').readFileSync(0));const bad=p.files.map(f=>f.path).filter(f=>!/^(dist\/|docs\/|scripts\/demo\.sh$|README\.md$|LICENSE$|NOTICE$|SECURITY\.md$|CHANGELOG\.md$|CONTRIBUTING\.md$|CODE_OF_CONDUCT\.md$|npm-shrinkwrap\.json$|package\.json$)/.test(f));if(bad.length){console.error('unexpected files',bad);process.exit(1)}console.log(p.files.length,'files ok')"
